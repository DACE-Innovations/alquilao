<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/seguridad.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil – Alquilao'</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --blue:#1A3FDB;--blue-dark:#1230B0;--blue-pale:#EEF1FF;
      --text:#0D1117;--text-2:#4A5568;--text-3:#8896A5;
      --white:#FFFFFF;--border:#E2E8F0;--bg:#F7F8FC;
      --success:#16A34A;--error:#EF4444;--sidebar-w:240px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);display:flex;min-height:100vh;color:var(--text);}

    .sidebar{width:var(--sidebar-w);background:var(--blue);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;}
    .sidebar-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);}
    .sidebar-logo img{height:40px;object-fit:contain;}
    .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.7);font-size:14px;font-weight:500;text-decoration:none;transition:all .2s;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
    .nav-item:hover{background:rgba(255,255,255,.08);color:white;}
    .nav-item.active{background:rgba(255,255,255,.15);color:white;font-weight:700;border-left:3px solid white;}
    .nav-item i{width:16px;text-align:center;font-size:15px;flex-shrink:0;}
    .nav-divider{height:1px;background:rgba(255,255,255,.1);margin:8px 20px;}
    .sidebar-footer{padding:12px 0;border-top:1px solid rgba(255,255,255,.1);}

    .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .topbar{background:white;border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:flex-end;gap:12px;position:sticky;top:0;z-index:5;}
    .topbar-bell{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;font-size:14px;transition:all .2s;}
    .topbar-bell:hover{background:var(--blue-pale);color:var(--blue);}
    .topbar-user{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:10px;transition:background .2s;}
    .topbar-user:hover{background:var(--bg);}
    .topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
    .topbar-name{font-size:14px;font-weight:600;}

    .content{padding:32px;flex:1;max-width:860px;}
    .page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;letter-spacing:-1px;margin-bottom:4px;}
    .page-sub{font-size:13px;color:var(--text-3);margin-bottom:28px;}

    .alert{display:none;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:20px;align-items:center;gap:10px;}
    .alert.success{background:#F0FDF4;color:var(--success);border:1px solid #BBF7D0;display:flex;}
    .alert.error{background:#FEF2F2;color:var(--error);border:1px solid #FECACA;display:flex;}

    .card{background:white;border:1px solid var(--border);border-radius:14px;padding:28px;}
    .profile-grid{display:grid;grid-template-columns:220px 1fr;gap:32px;}

    .foto-section{display:flex;flex-direction:column;align-items:center;gap:14px;}
    .foto-label{font-size:14px;font-weight:700;align-self:flex-start;}
    .foto-upload{width:160px;height:160px;border-radius:50%;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:var(--bg);}
    .foto-upload:hover{border-color:var(--blue);background:var(--blue-pale);}
    .foto-upload i{font-size:24px;color:var(--blue);}
    .foto-upload span{font-size:12px;font-weight:600;color:var(--text-2);}
    .foto-upload small{font-size:10px;color:var(--text-3);text-align:center;line-height:1.4;}
    .foto-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .foto-preview{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none;}
    .btn-seleccionar{background:none;border:1.5px solid var(--blue);color:var(--blue);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px;padding:9px 20px;border-radius:9px;cursor:pointer;transition:all .2s;}
    .btn-seleccionar:hover{background:var(--blue);color:white;}

    .form-section{display:flex;flex-direction:column;gap:18px;}
    .rol-label{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .rol-badge{display:inline-flex;align-items:center;gap:8px;background:var(--blue-pale);color:var(--blue);font-size:13px;font-weight:700;padding:7px 14px;border-radius:50px;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .field label{font-size:13px;font-weight:600;}
    .input-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;gap:10px;background:var(--bg);transition:all .2s;}
    .input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,63,219,.08);background:white;}
    .input-wrap i{color:var(--text-3);font-size:13px;flex-shrink:0;}
    .input-wrap input{flex:1;border:none;outline:none;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--text);padding:12px 0;}
    .input-wrap input::placeholder{color:var(--text-3);}
    .toggle-pass{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;transition:color .2s;padding:0;}
    .toggle-pass:hover{color:var(--blue);}
    .pass-row{display:flex;gap:10px;}
    .pass-row .input-wrap{flex:1;}
    .btn-cambiar-pass{display:flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:none;color:var(--text-2);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;padding:12px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .2s;}
    .btn-cambiar-pass:hover{border-color:var(--blue);color:var(--blue);}
    .form-footer{display:flex;justify-content:flex-end;padding-top:4px;}
    .btn-guardar{display:flex;align-items:center;gap:8px;background:var(--blue);color:white;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;}
    .btn-guardar:hover{background:var(--blue-dark);box-shadow:0 8px 24px rgba(26,63,219,.25);transform:translateY(-1px);}
    .btn-guardar:disabled{opacity:.6;cursor:not-allowed;transform:none;}

    @media(max-width:860px){.sidebar{display:none;}.main{margin-left:0;}.profile-grid{grid-template-columns:1fr;}.content{padding:20px;}}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../images/logo_alquilao1.png" alt="Alquilao'"/>
  </div>
  <nav class="sidebar-nav">
    <a href="../html/index.html" class="nav-item"><i class="fa-solid fa-house"></i> Inicio</a>
    <a href="mensajes.html" class="nav-item"><i class="fa-regular fa-comment-dots"></i> Mensajes</a>
    <a href="favoritos.html" class="nav-item"><i class="fa-regular fa-heart"></i> Favoritos</a>
    <div class="nav-divider"></div>
    <a href="mis-publicaciones.html" class="nav-item vendor-only"><i class="fa-solid fa-list"></i> Mis Publicaciones</a>
   <a href="../html/publicar-propiedad.html" class="nav-item vendor-only"><i class="fa-solid fa-plus"></i> Nueva Publicación</a>
    <div class="nav-divider"></div>
    <a href="perfil.html" class="nav-item active"><i class="fa-regular fa-user"></i> Mi Perfil</a>
    <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Configuración</a>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-item" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-bell"><i class="fa-regular fa-bell"></i></div>
    <div class="topbar-user">
      <div class="topbar-avatar" id="avatar-inicial">JP</div>
      <span class="topbar-name" id="topbar-nombre">Juan Pérez</span>
      <i class="fa-solid fa-chevron-down" style="font-size:11px;color:var(--text-3);margin-left:4px"></i>
    </div>
  </div>
  <div class="content">
    <h1 class="page-title">Mi Perfil</h1>
    <p class="page-sub">Administra tu información personal y preferencias.</p>
    <div class="alert" id="alert"><i class="fa-solid fa-circle-check"></i><span id="alert-msg"></span></div>
    <div class="card">
      <div class="profile-grid">
        <div class="foto-section">
          <div class="foto-label">Foto de perfil</div>
          <div class="foto-upload" onclick="document.getElementById('foto-input').click()">
            <img class="foto-preview" id="foto-preview" alt=""/>
            <i class="fa-regular fa-camera" id="foto-icon"></i>
            <span id="foto-text">Sube tu foto</span>
            <small id="foto-small">JPG, PNG o GIF<br/>Máx. 5MB</small>
            <input type="file" id="foto-input" accept="image/*" onchange="previewFoto(this)"/>
          </div>
          <button class="btn-seleccionar" onclick="document.getElementById('foto-input').click()">Seleccionar archivo</button>
        </div>
        <div class="form-section">
          <div>
            <div class="rol-label">Rol de usuario</div>
            <div class="rol-badge"><i class="fa-regular fa-user"></i><span id="rol-texto">Inquilino</span></div>
          </div>
          <div class="field">
            <label>Nombre completo</label>
            <div class="input-wrap"><i class="fa-regular fa-user"></i><input type="text" id="nombre" placeholder="Tu nombre completo"/></div>
          </div>
          <div class="field">
            <label>Correo electrónico</label>
            <div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="correo" placeholder="tu@correo.com"/></div>
          </div>
          <div class="field">
            <label>Teléfono</label>
            <div class="input-wrap"><i class="fa-solid fa-phone"></i><input type="tel" id="telefono" placeholder="829-000-0000"/></div>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <div class="pass-row">
              <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="pass" value="••••••••••" readonly/></div>
              <button class="btn-cambiar-pass" onclick="window.location.href='../html/recuperar-password.html'"><i class="fa-solid fa-lock"></i> Cambiar</button>
            </div>
          </div>
          <div class="form-footer">
            <button class="btn-guardar" id="btn-guardar" onclick="guardarCambios()"><i class="fa-solid fa-floppy-disk"></i> Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    cargarUsuario({ nombre:'Juan Pérez', correo:'juan@email.com', telefono:'829-123-4567', rol:'vendedor' });
  });
  function cargarUsuario(u) {
    document.getElementById('nombre').value = u.nombre;
    document.getElementById('correo').value = u.correo;
    document.getElementById('telefono').value = u.telefono;
    document.getElementById('topbar-nombre').textContent = u.nombre;
    document.getElementById('avatar-inicial').textContent = u.nombre.charAt(0).toUpperCase();
    document.getElementById('rol-texto').textContent = (u.rol==='vendedor'||u.rol==='propietario') ? 'Propietario / Agente' : 'Inquilino';
  }
  function previewFoto(input) {
    if (!input.files[0]) return;
    if (input.files[0].size > 5*1024*1024) return showAlert('La imagen no puede superar 5MB.','error');
    const reader = new FileReader();
    reader.onload = e => {
      const p = document.getElementById('foto-preview');
      p.src = e.target.result; p.style.display = 'block';
      ['foto-icon','foto-text','foto-small'].forEach(id => document.getElementById(id).style.display='none');
    };
    reader.readAsDataURL(input.files[0]);
  }
  async function guardarCambios() {
    const nombre = document.getElementById('nombre').value.trim();
    const correo = document.getElementById('correo').value.trim();
    if (!nombre||!correo) return showAlert('Nombre y correo son obligatorios.','error');
    const btn = document.getElementById('btn-guardar');
    btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
    await new Promise(r=>setTimeout(r,900));
    document.getElementById('topbar-nombre').textContent = nombre;
    document.getElementById('avatar-inicial').textContent = nombre.charAt(0).toUpperCase();
    showAlert('¡Perfil actualizado correctamente!','success');
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Guardar cambios';
  }
  function cerrarSesion() { sessionStorage.clear(); window.location.href='../html/login.html'; }
  function showAlert(msg,type) {
    const el=document.getElementById('alert');
    document.getElementById('alert-msg').textContent=msg;
    el.className=`alert ${type}`;
    setTimeout(()=>el.className='alert',3500);
  }
</script>
</body>
</html>
