<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../../js/seguridad.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Contraseña – Alquilao'</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{ --blue:#1A3FDB; --blue-dark:#1230B0; --blue-pale:#EEF1FF; --text:#0D1117; --text-2:#4A5568; --text-3:#8896A5; --border:#E2E8F0; --error:#EF4444; --success:#16A34A; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f4ff;padding:24px;}

    .bg{position:fixed;inset:0;background:url('../images/foto_rd.jpg') center/cover no-repeat;z-index:0;}
    .bg-overlay{position:fixed;inset:0;background:rgba(235,241,255,0.88);z-index:1;}

    .card{
      position:relative;z-index:2;
      background:white;border-radius:24px;
      padding:52px 48px;width:100%;max-width:460px;
      box-shadow:0 24px 64px rgba(26,63,219,.12);
      animation:fadeUp .7s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

    .logo{display:flex;justify-content:center;margin-bottom:32px;}
    .logo img{height:48px;object-fit:contain;}

    .icon-wrap{
      width:72px;height:72px;background:var(--blue-pale);border-radius:20px;
      display:flex;align-items:center;justify-content:center;
      font-size:30px;color:var(--blue);margin:0 auto 24px;
    }

    .card-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--text);text-align:center;letter-spacing:-1px;margin-bottom:8px;}
    .card-sub{font-size:14px;color:var(--text-2);text-align:center;line-height:1.6;margin-bottom:32px;}

    .field{margin-bottom:20px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:7px;}
    .input-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;padding:0 14px;gap:10px;background:#FAFBFF;transition:border-color .2s,box-shadow .2s;}
    .input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,63,219,.1);background:white;}
    .input-wrap.error{border-color:var(--error);}
    .input-wrap i{color:var(--text-3);font-size:14px;}
    .input-wrap input{flex:1;border:none;outline:none;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--text);padding:13px 0;}
    .input-wrap input::placeholder{color:var(--text-3);}
    .field-error{font-size:11px;color:var(--error);margin-top:4px;display:none;}
    .field-error.show{display:block;}

    .alert{display:none;padding:14px 16px;border-radius:12px;font-size:13px;font-weight:500;margin-bottom:20px;align-items:center;gap:10px;text-align:center;flex-direction:column;}
    .alert.success{background:#F0FDF4;color:var(--success);border:1px solid #BBF7D0;display:flex;}
    .alert.error{background:#FEF2F2;color:var(--error);border:1px solid #FECACA;display:flex;}
    .alert i{font-size:28px;}

    .btn-submit{width:100%;background:var(--blue);color:white;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;padding:15px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .22s,box-shadow .22s,transform .22s;margin-bottom:20px;}
    .btn-submit:hover{background:var(--blue-dark);box-shadow:0 8px 24px rgba(26,63,219,.3);transform:translateY(-1px);}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}

    .back-link{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--text-2);text-decoration:none;transition:color .2s;}
    .back-link:hover{color:var(--blue);}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="card">
  <div class="logo"><img src="../../images/logo_alquilao1.png" alt="Alquilao'"/></div>

  <div class="icon-wrap"><i class="fa-solid fa-key"></i></div>
  <h2 class="card-title">¿Olvidaste tu contraseña?</h2>
  <p class="card-sub">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

  <div class="alert" id="alert">
    <i class="fa-solid fa-circle-check"></i>
    <span id="alert-msg"></span>
  </div>

  <div class="field" id="form-field">
    <label>Correo electrónico</label>
    <div class="input-wrap" id="wrap-correo">
      <i class="fa-regular fa-envelope"></i>
      <input type="email" id="correo" placeholder="ejemplo@correo.com"/>
    </div>
    <span class="field-error" id="err-correo">Ingresa un correo válido.</span>
  </div>

  <button class="btn-submit" id="btn-send" onclick="handleRecuperar()">
    Enviar enlace <i class="fa-solid fa-paper-plane"></i>
  </button>

  <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
</div>

<script>
  async function handleRecuperar() {
    const correo = document.getElementById('correo').value.trim();
    const valid  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);

    document.getElementById('wrap-correo').classList.toggle('error', !valid);
    document.getElementById('err-correo').classList.toggle('show', !valid);
    if (!valid) return;

    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';

    try {
      // ── Conectar con backend ──
      // await fetch('/api/auth/recuperar', {
      //   method:'POST',
      //   headers:{'Content-Type':'application/json'},
      //   body: JSON.stringify({ correo })
      // });

      // ── Demo ──
      await new Promise(r => setTimeout(r, 1200));

      document.getElementById('form-field').style.display = 'none';
      btn.style.display = 'none';

      const alert = document.getElementById('alert');
      document.getElementById('alert-msg').textContent = `Hemos enviado un enlace de recuperación a ${correo}. Revisa tu bandeja de entrada.`;
      alert.className = 'alert success';

    } catch(e) {
      const alert = document.getElementById('alert');
      document.getElementById('alert-msg').textContent = 'Error al enviar el correo. Intenta de nuevo.';
      alert.className = 'alert error';
      btn.disabled = false;
      btn.innerHTML = 'Enviar enlace <i class="fa-solid fa-paper-plane"></i>';
    }
  }

  document.addEventListener('keydown', e => { if(e.key==='Enter') handleRecuperar(); });
</script>
</body>
</html>
